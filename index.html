<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="ALFABASA — Platform ensiklopedia dan pembelajaran bahasa global. Kenali Bahasa • Baca Aksara • Pahami Budaya.">
<title>ALFABASA — Kenali Bahasa • Baca Aksara • Pahami Budaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ALFABASA — Design System
   Material Design 3 · AMOLED Dark / Light · Indigo accent
   ============================================================ */

/* ---------- THEMES ---------- */
:root{
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:24px;
  --t-fast:.18s ease; --t-med:.3s cubic-bezier(.4,0,.2,1);
  --elev-1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);
  --elev-2:0 1px 2px rgba(0,0,0,.3),0 2px 6px 2px rgba(0,0,0,.2);
  --nav-h:68px;
}
html[data-theme="dark"]{
  --bg:#000000; --surface:#0A0A0A; --surface-variant:#151515;
  --primary:#8C9EFF; --primary-container:#202A5C; --on-primary-container:#E2E7FF;
  --text-primary:#FFFFFF; --text-secondary:#B8B8B8; --border:#292929;
  --primary-fg:#1A1F33;
  --success:#9CE0A7; --success-container:#1B3622; --danger:#FFB4AB; --danger-container:#3B1512;
  --chip-bg:#151515; --chip-border:#292929;
  --skeleton-a:#161616; --skeleton-b:#232323;
  --scrollbar:#2E2E2E;
  --hero-grad:linear-gradient(135deg,#202A5C 0%,#0E1230 55%,#000000 100%);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F8F9FC; --surface-variant:#EEF0F7;
  --primary:#3F51B5; --primary-container:#E0E7FF; --on-primary-container:#1A237E;
  --text-primary:#171717; --text-secondary:#5F6368; --border:#DADCE5;
  --primary-fg:#FFFFFF;
  --success:#2E7D32; --success-container:#DCEDDC; --danger:#C62828; --danger-container:#FBE3E1;
  --chip-bg:#EEF0F7; --chip-border:#DADCE5;
  --skeleton-a:#ECEDF2; --skeleton-b:#DADCE5;
  --scrollbar:#C5C9D4;
  --hero-grad:linear-gradient(135deg,#E0E7FF 0%,#F0F4FF 55%,#FFFFFF 100%);
  color-scheme:light;
}

/* ---------- BASE ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text-primary);
  line-height:1.5;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%;display:block}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
::selection{background:var(--primary-container);color:var(--on-primary-container)}

/* Material Symbols */
.ms{
  font-family:'Material Symbols Outlined';
  font-weight:normal;font-style:normal;font-size:22px;line-height:1;
  letter-spacing:normal;text-transform:none;display:inline-block;
  white-space:nowrap;word-wrap:normal;direction:ltr;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  user-select:none;vertical-align:middle;
}
.ms.fill{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

/* ---------- LAYOUT SHELL ---------- */
.app-shell{display:flex;min-height:100vh}
.content{
  flex:1;min-width:0;
  width:100%;
  margin-left:0;
  padding-bottom:calc(var(--nav-h) + 24px);
}
.rail{
  display:none;
  flex-direction:column;
  width:84px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;
  padding:16px 8px;
  gap:4px;
  z-index:50;
}
.rail-brand{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:10px 4px 18px;cursor:pointer;
}
.rail-logo{
  width:44px;height:44px;border-radius:14px;
  background:var(--primary-container);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;letter-spacing:.5px;
}
.rail-word{font-size:9.5px;font-weight:800;letter-spacing:1.6px;color:var(--text-secondary)}
.rail-items{display:flex;flex-direction:column;gap:6px;flex:1}
.rail-item{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 4px;border-radius:14px;color:var(--text-secondary);
  cursor:pointer;transition:var(--t-fast);text-align:center;
}
.rail-item:hover{background:var(--surface-variant);color:var(--text-primary)}
.rail-item.active{background:var(--primary-container);color:var(--primary)}
.rail-label{font-size:10.5px;font-weight:600;letter-spacing:.2px}
.rail-divider{height:1px;background:var(--border);margin:8px 6px}
.rail-theme{margin-top:auto}

/* ---------- BOTTOM NAV ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:60;
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--border);
  height:var(--nav-h);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:var(--elev-2);
}
.bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--text-secondary);cursor:pointer;transition:var(--t-fast);
  position:relative;
}
.bn-item:hover{color:var(--text-primary)}
.bn-item.active{color:var(--primary)}
.bn-item.active .bn-icon{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.bn-icon{font-size:24px;transition:var(--t-fast)}
.bn-label{font-size:11px;font-weight:600;letter-spacing:.2px}

/* ---------- TYPOGRAPHY ---------- */
.display{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
.headline{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.3px}
.title-lg{font-size:20px;line-height:1.3;font-weight:700}
.title-md{font-size:16px;line-height:1.35;font-weight:700}
.title-sm{font-size:14px;font-weight:700}
.body-lg{font-size:16px;line-height:1.55}
.body{font-size:14.5px;line-height:1.55}
.body-sm{font-size:13px;line-height:1.5}
.label{font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--text-secondary)}
.meta{font-size:12.5px;color:var(--text-secondary);line-height:1.45}
.muted{color:var(--text-secondary)}

/* ---------- CONTAINERS ---------- */
.container{max-width:1120px;margin:0 auto;padding:16px 16px 24px}
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:12px}
.section-title{font-size:17px;font-weight:800;letter-spacing:-.2px}
.section-link{font-size:13px;font-weight:600;color:var(--primary);cursor:pointer}

/* ---------- PAGE HEADER ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.page-title{font-size:24px;font-weight:800;letter-spacing:-.3px}
.page-sub{font-size:13px;color:var(--text-secondary)}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text-primary);background:var(--surface-variant);
  transition:var(--t-fast);cursor:pointer;position:relative;flex-shrink:0;
}
.icon-btn:hover{background:var(--border)}
.icon-btn .ms{font-size:22px}
.icon-btn.badge-dot::after{
  content:'';position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
  background:var(--primary);border:2px solid var(--bg);
}

/* ---------- SEARCH BAR ---------- */
.searchbar{
  display:flex;align-items:center;gap:10px;
  background:var(--surface-variant);
  border:1px solid transparent;
  border-radius:var(--r-xl);
  padding:4px 6px 4px 16px;
  min-height:50px;
  transition:var(--t-fast);
}
.searchbar:focus-within{border-color:var(--primary);background:var(--surface)}
.searchbar .ms{color:var(--text-secondary)}
.searchbar input{
  flex:1;background:none;border:none;outline:none;font-size:15px;min-width:0;
}
.searchbar input::placeholder{color:var(--text-secondary)}
.search-clear{display:none}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 20px;height:44px;border-radius:22px;
  font-weight:700;font-size:14.5px;letter-spacing:.1px;
  transition:var(--t-fast);cursor:pointer;white-space:nowrap;
}
.btn .ms{font-size:20px}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-primary:active{transform:scale(.97)}
.btn-tonal{background:var(--primary-container);color:var(--primary)}
.btn-tonal:hover{filter:brightness(1.06)}
.btn-outline{border:1px solid var(--border);color:var(--text-primary);background:transparent}
.btn-outline:hover{background:var(--surface-variant)}
.btn-full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- CHIPS ---------- */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;display:inline-flex;align-items:center;gap:6px;
  padding:0 16px;height:38px;border-radius:19px;
  background:var(--chip-bg);border:1px solid var(--chip-border);
  color:var(--text-secondary);font-size:13.5px;font-weight:600;
  cursor:pointer;transition:var(--t-fast);
}
.chip .ms{font-size:17px}
.chip:hover{color:var(--text-primary);border-color:var(--primary)}
.chip.active{background:var(--primary-container);border-color:var(--primary);color:var(--primary)}
.chip.active .ms{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

/* ---------- CARDS ---------- */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-l);padding:16px;transition:var(--t-med);
}
.card-hover{cursor:pointer}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--elev-1);border-color:var(--primary)}
.explore-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.explore-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
  padding:16px 14px;cursor:pointer;transition:var(--t-med);
  display:flex;flex-direction:column;gap:10px;
}
.explore-card:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--elev-1)}
.explore-card .ec-icon{
  width:40px;height:40px;border-radius:12px;
  background:var(--primary-container);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
}
.explore-card .ec-icon .ms{font-size:21px}
.explore-card .ec-title{font-size:14.5px;font-weight:700}
.explore-card .ec-desc{font-size:12px;color:var(--text-secondary);line-height:1.45}

/* ---------- LISTS ---------- */
.list{display:flex;flex-direction:column;border-radius:var(--r-l);overflow:hidden;background:var(--surface);border:1px solid var(--border)}
.list-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;cursor:pointer;transition:var(--t-fast);
  border-bottom:1px solid var(--border);min-height:64px;
}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--surface-variant)}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-size:15px;font-weight:700}
.list-item .li-sub{font-size:12.5px;color:var(--text-secondary);margin-top:1px;line-height:1.4}
.list-item .ms.chev{color:var(--text-secondary);opacity:.6;flex-shrink:0}
.avatar{
  width:42px;height:42px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;letter-spacing:.5px;
  background:var(--primary-container);color:var(--primary);
}
.avatar.glyph{font-size:20px;background:var(--surface-variant);color:var(--text-primary)}

/* ---------- BADGES / STATUS ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
  background:var(--surface-variant);color:var(--text-secondary);border:1px solid var(--border);
  white-space:nowrap;
}
.badge.primary{background:var(--primary-container);color:var(--primary);border-color:transparent}
.badge.success{background:var(--success-container);color:var(--success);border-color:transparent}
.badge.danger{background:var(--danger-container);color:var(--danger);border-color:transparent}
.badge.outline{border-color:var(--primary);color:var(--primary);background:transparent}

/* ---------- HORIZONTAL SCROLL ---------- */
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.h-scroll::-webkit-scrollbar{display:none}
.h-card{
  flex-shrink:0;width:178px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);
  overflow:hidden;cursor:pointer;transition:var(--t-med);
}
.h-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.h-card .hc-art{
  height:92px;display:flex;align-items:center;justify-content:center;
  background:var(--hero-grad);position:relative;overflow:hidden;
}
.h-card .hc-art .hc-glyph{font-size:44px;color:var(--primary);opacity:.92}
.h-card .hc-art .hc-cat{
  position:absolute;top:8px;left:8px;
  font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  background:rgba(0,0,0,.45);color:#fff;padding:3px 8px;border-radius:999px;
}
html[data-theme="light"] .h-card .hc-art .hc-cat{background:rgba(63,81,181,.14);color:var(--primary)}
.h-card .hc-body{padding:10px 12px 12px}
.h-card .hc-title{font-size:13.5px;font-weight:700;line-height:1.3}
.h-card .hc-sub{font-size:11px;color:var(--text-secondary);margin-top:3px;line-height:1.4}

/* ---------- FEATURED CAROUSEL ---------- */
.carousel{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--border)}
.carousel-track{display:flex;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.carousel-slide{
  flex:0 0 100%;min-height:218px;position:relative;overflow:hidden;
  cursor:pointer;background:var(--hero-grad);
  display:flex;align-items:flex-end;padding:20px;
}
.carousel-slide .cs-art{
  position:absolute;top:0;right:-12px;bottom:0;width:52%;
  display:flex;align-items:center;justify-content:center;
  font-size:130px;color:var(--primary);opacity:.16;user-select:none;
  transform:rotate(-6deg);
}
.carousel-slide .cs-cat{
  position:absolute;top:16px;left:20px;
  font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--primary);
}
.carousel-slide .cs-body{position:relative;z-index:2;max-width:75%}
.carousel-slide .cs-title{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin-bottom:6px}
.carousel-slide .cs-desc{font-size:12.5px;color:var(--text-secondary);line-height:1.5;margin-bottom:12px;max-width:330px}
.carousel-slide .cs-cta{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--primary);color:var(--primary-fg);
  padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;
  transition:var(--t-fast);
}
.carousel-slide .cs-cta:hover{filter:brightness(1.1)}
.carousel-dots{
  position:absolute;bottom:12px;right:20px;display:flex;gap:6px;z-index:3;
}
.carousel-dots button{
  width:8px;height:8px;border-radius:999px;background:var(--border);
  transition:var(--t-med);padding:0;cursor:pointer;
}
.carousel-dots button.active{width:22px;background:var(--primary)}

/* ---------- EXPANDABLE ---------- */
.expandable{border-bottom:1px solid var(--border)}
.expandable:last-child{border-bottom:none}
.exp-head{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:15px 16px;cursor:pointer;transition:var(--t-fast);text-align:left;
}
.exp-head:hover{background:var(--surface-variant)}
.exp-head .ms.exp-icon{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  background:var(--primary-container);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.exp-head .exp-title{flex:1;font-size:14.5px;font-weight:700}
.exp-head .exp-chev{color:var(--text-secondary);transition:transform .3s cubic-bezier(.4,0,.2,1);font-size:20px}
.expandable.open .exp-chev{transform:rotate(180deg)}
.exp-body{
  display:none;padding:0 16px 16px 62px;
}
.expandable.open .exp-body{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- SKELETON ---------- */
.skeleton{position:relative;overflow:hidden;background:var(--skeleton-a);border-radius:8px}
.skeleton::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:shimmer 1.3s infinite;
}
html[data-theme="light"] .skeleton::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent)}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.sk-line{height:14px;border-radius:7px;margin-bottom:10px}
.sk-card{height:120px;border-radius:var(--r-l)}
.sk-list{height:64px;border-radius:var(--r-l);margin-bottom:10px}

/* ---------- PROGRESS ---------- */
.progress-track{height:8px;border-radius:999px;background:var(--surface-variant);overflow:hidden}
.progress-fill{
  height:100%;border-radius:999px;background:var(--primary);
  width:0;transition:width .8s cubic-bezier(.4,0,.2,1);
}
.progress-fill.animated{width:var(--pct,0%)}
.progress-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-secondary);margin-bottom:5px;font-weight:600}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--text-secondary);
  border-bottom:2.5px solid transparent;cursor:pointer;transition:var(--t-fast);margin-bottom:-1px;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ---------- STATES ---------- */
.state-box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:56px 24px}
.state-box .st-icon{
  width:72px;height:72px;border-radius:50%;
  background:var(--primary-container);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
}
.state-box .st-icon .ms{font-size:34px}
.state-box .st-title{font-size:17px;font-weight:800}
.state-box .st-desc{font-size:13.5px;color:var(--text-secondary);max-width:300px;line-height:1.55}

/* ---------- AUDIO ---------- */
.audio-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;
  background:var(--surface-variant);border:1px solid var(--border);cursor:pointer;
  transition:var(--t-fast);color:var(--text-primary);
}
.audio-btn:hover{border-color:var(--primary);color:var(--primary)}
.audio-btn.playing{background:var(--primary-container);border-color:var(--primary);color:var(--primary)}
.audio-btn .ms{font-size:18px}
.audio-eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.audio-eq span{width:3px;background:var(--primary);border-radius:2px;animation:eq 1s infinite}
.audio-eq span:nth-child(2){animation-delay:.2s}
.audio-eq span:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}

/* ---------- AI CHAT ---------- */
.ai-shell{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - 56px);min-height:420px}
.ai-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px 16px}
.ai-msg{max-width:86%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.55;animation:fadeIn .25s ease}
.ai-msg.bot{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:6px;align-self:flex-start}
.ai-msg.user{background:var(--primary);color:var(--primary-fg);border-bottom-right-radius:6px;align-self:flex-end}
.ai-msg .ai-meta{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.ai-msg .ai-meta .ms{font-size:16px;color:var(--primary)}
.ai-msg.user .ai-meta .ms{color:inherit;opacity:.85}
.ai-msg .ai-src{font-size:11px;opacity:.65;margin-top:8px;font-style:italic}
.ai-chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.ai-chips::-webkit-scrollbar{display:none}
.ai-input{

  background:var(--surface-variant);border-radius:var(--r-xl);
  padding:6px 6px 6px 16px;
}
.ai-input textarea{
  flex:1;background:none;border:none;outline:none;resize:none;
  font-size:14.5px;padding:10px 0;max-height:110px;min-height:24px;
}
.ai-send{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:var(--primary);color:var(--primary-fg);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:var(--t-fast);
}
.ai-send:hover{filter:brightness(1.1)}
.ai-send .ms{font-size:20px}
.typing-dots{display:inline-flex;gap:4px;padding:4px 2px}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--text-secondary);animation:td 1s infinite}
.typing-dots span:nth-child(2){animation-delay:.18s}
.typing-dots span:nth-child(3){animation-delay:.36s}

/* ---------- EXERCISE ---------- */
.ex-progress{margin-bottom:20px}
.ex-q{margin-bottom:6px}
.ex-options{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ex-option{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:var(--r-m);
  border:1.5px solid var(--border);background:var(--surface);
  cursor:pointer;font-size:14.5px;font-weight:600;transition:var(--t-fast);text-align:left;
}
.ex-option .opt-letter{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  background:var(--surface-variant);display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;color:var(--text-secondary);
}
.ex-option:hover{border-color:var(--primary)}
.ex-option.correct{border-color:var(--success);background:var(--success-container);color:var(--success)}
.ex-option.correct .opt-letter{background:var(--success);color:#fff}
.ex-option.wrong{border-color:var(--danger);background:var(--danger-container);color:var(--danger)}
.ex-option.wrong .opt-letter{background:var(--danger);color:#fff}
.ex-option.disabled{pointer-events:none}
.ex-feedback{
  margin-top:16px;padding:14px 16px;border-radius:var(--r-m);
  font-size:13.5px;line-height:1.55;animation:fadeIn .25s ease;
}
.ex-feedback.ok{background:var(--success-container);color:var(--success)}
.ex-feedback.no{background:var(--danger-container);color:var(--danger)}
.ex-feedback .fb-label{font-weight:800;margin-bottom:3px}
.ex-result{text-align:center;padding:32px 20px;animation:fadeIn .3s ease}
.ex-score-ring{
  width:130px;height:130px;border-radius:50%;margin:0 auto 18px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:conic-gradient(var(--primary) calc(var(--score,0)*1%),var(--surface-variant) 0);
}
.ex-score-ring::before{content:'';position:absolute;inset:12px;background:var(--surface);border-radius:50%}
.ex-score-ring{position:relative}
.ex-score-ring .sr-num{position:relative;z-index:2;font-size:32px;font-weight:800}
.ex-score-ring .sr-label{position:relative;z-index:2;font-size:11px;color:var(--text-secondary);font-weight:700;letter-spacing:1px;text-transform:uppercase}

/* ---------- WORD DETAIL ---------- */
.word-hero{text-align:center;padding:28px 16px 22px}
.word-glyph{font-size:52px;font-weight:800;line-height:1.15}
.word-ipa{font-size:19px;color:var(--text-secondary);margin-top:6px;letter-spacing:.5px}
.word-actions{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ---------- HERO / GLYPH ART ---------- */
.hero-art{
  height:150px;border-radius:var(--r-xl);position:relative;overflow:hidden;
  background:var(--hero-grad);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
}
.hero-art .ha-glyph{font-size:76px;color:var(--primary);opacity:.85}
.hero-art .ha-label{position:absolute;bottom:12px;left:20px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--text-secondary)}

/* ---------- KEY INFO GRID ---------- */
.keyinfo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.ki-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:12px 14px}
.ki-item .ki-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);margin-bottom:4px}
.ki-item .ki-value{font-size:14px;font-weight:700;line-height:1.4}
.ki-item.full{grid-column:1/-1}

/* ---------- RELATED CONTENT ---------- */
.related-list{display:flex;flex-wrap:wrap;gap:8px}
.related-list .chip{cursor:pointer}

/* ---------- TOAST ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--text-primary);color:var(--bg);
  padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:var(--t-med);z-index:100;
  max-width:calc(100vw - 48px);text-align:center;box-shadow:var(--elev-2);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- MISC ---------- */
.divider{height:1px;background:var(--border);margin:14px 0}
.row{display:flex;align-items:center;gap:12px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.spacer{flex:1}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:14px;text-align:center}
.stat-box .sb-num{font-size:22px;font-weight:800}
.stat-box .sb-label{font-size:11px;color:var(--text-secondary);font-weight:600;margin-top:2px}
.switch{position:relative;width:52px;height:32px;flex-shrink:0;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{
  position:absolute;inset:0;border-radius:999px;background:var(--surface-variant);

}
.switch .thumb{
  position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:var(--text-secondary);transition:var(--t-med);
}
.switch input:checked + .track{background:var(--primary);border-color:var(--primary)}
.switch input:checked + .track + .thumb{left:23px;background:#fff}
.setting-row{
  display:flex;align-items:center;gap:14px;padding:15px 4px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:var(--t-fast);

.setting-row:last-child{border-bottom:none}
.setting-row:hover{background:var(--surface-variant)}
.setting-row .set-icon{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:var(--primary-container);color:var(--primary);
  display:flex;align-items:center;justify-content:center;
}
.setting-row .set-icon .ms{font-size:20px}
.theme-pick{display:flex;gap:12px;margin-top:8px}
.theme-card{
  flex:1;border:2px solid var(--border);border-radius:var(--r-l);overflow:hidden;cursor:pointer;transition:var(--t-fast);
}
.theme-card:hover{border-color:var(--primary)}
.theme-card.active{border-color:var(--primary)}
.theme-card .tc-prev{height:76px;display:flex;align-items:flex-end;padding:10px;gap:4px}
.theme-card .tc-prev span{width:18%;height:12px;border-radius:3px;background:var(--text-secondary);opacity:.5}
.theme-card .tc-prev span:nth-child(2){height:20px}
.theme-card .tc-prev span:nth-child(3){height:16px}
.theme-card .tc-name{padding:9px 12px;font-size:12.5px;font-weight:700;text-align:center}
.tc-amoled{background:#000;border:1px solid #292929}
.tc-amoled .tc-name{background:#0A0A0A;color:#fff}
.tc-light{background:#fff;border:1px solid #DADCE5}
.tc-light .tc-name{background:#F8F9FC;color:#171717}
.scroll-top{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px);z-index:55}

/* ---------- RESPONSIVE ---------- */
@media(min-width:600px){
  .content{padding-bottom:24px}
  .container{padding:20px 24px 32px}
  .explore-grid{grid-template-columns:repeat(3,1fr)}
  .keyinfo{grid-template-columns:repeat(3,1fr)}
  .display{font-size:38px}
}
@media(min-width:1024px){
  .rail{display:flex}
  .bottom-nav{display:none}
  .content{margin-left:0}
  .container{max-width:1120px;padding:24px 32px 40px}
  .explore-grid{grid-template-columns:repeat(4,1fr)}
  .carousel-slide{min-height:280px}
  .carousel-slide .cs-title{font-size:30px}
  .carousel-slide .cs-art{font-size:190px}
  .detail-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
  .detail-side{position:sticky;top:24px}
  .h-card{width:210px}
  .keyinfo{grid-template-columns:repeat(4,1fr)}
  .stat-row{grid-template-columns:repeat(4,1fr)}
  .ai-shell{height:calc(100vh - 120px)}
}
@media(min-width:1280px){
  .container{max-width:1200px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

  let audioCtx = null, audioPlaying = false;
  function playDemoAudio(text, btnEl) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t0 = audioCtx.currentTime;
      let hash = 0;
      const key = String(text || 'a');
      for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
      const baseFreq = 180 + (hash % 260);
      const notes = [baseFreq, baseFreq * 1.25, baseFreq * 1.5];
      notes.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = f;
        const t = t0 + i * 0.14;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.18, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t); osc.stop(t + 0.14);
      });
      if (btnEl) {
        btnEl.classList.add('playing');
        btnEl.innerHTML = '<span class="audio-eq"><span></span><span></span><span></span></span> Demo';
        setTimeout(() => {
          btnEl.classList.remove('playing');
          btnEl.innerHTML = icon('volume_up') + ' Demo';
        }, 900);
      }
    } catch (e) { toast('Audio tidak tersedia di lingkungan ini.'); }

        const ascore = at === q ? 0 : at.startsWith(q) ? 1 : at.includes(q) ? 2 : 3;

    const track = $('.carousel-track', root);

    const slides = $$('.carousel-slide', track);
    const dots = $$('.carousel-dots button', root);
    let idx = 0, paused = false;
    const go = (i) => {
      idx = (i + slides.length) % slides.length;
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
      dots.forEach((d, j) => d.classList.toggle('active', j === idx));
      const slide = slides[idx];
      if (slide) { const target = slide.dataset.target; if (target) { slides.forEach(s => s.setAttribute('aria-hidden', 'true')); slide.setAttribute('aria-hidden', 'false'); } }
    };
    const start = () => {
      stop();
      carouselTimer = setInterval(() => { if (!paused && !document.hidden) go(idx + 1); }, 5000);
    };
    const stop = () => { clearInterval(carouselTimer); carouselTimer = null; };
    dots.forEach((d, i) => d.addEventListener('click', () => { go(i); start(); }));
    // Pause saat disentuh / hover
    track.addEventListener('mouseenter', () => { paused = true; });
    track.addEventListener('mouseleave', () => { paused = false; });
    track.addEventListener('touchstart', () => { paused = true; }, { passive: true });
    track.addEventListener('touchend', () => { setTimeout(() => { paused = false; }, 4000); }, { passive: true });

    track.addEventListener('touchend', (e) => {
      if (sx === null) return;

      if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));

      '<button class="icon-btn" data-action="back-lesson" aria-label="Kembali ke pelajaran">' + icon('close') + '</button></div>' +
      '<div class="ex-progress"><div class="progress-label"><span>Soal ' + (st.qi + 1) + ' dari ' + total + '</span><span>' + pct + '%</span></div>' +
      '<div class="progress-track"><div class="progress-fill animated" style="--pct:' + pct + '%"></div></div></div>' +
      '<div class="card"><div class="ex-q headline" style="font-size:21px">' + esc(q.q) + '</div>' +
      '<div class="ex-options">' + q.options.map((o, i) =>
        '<button class="ex-option" data-action="ex-opt" data-q="' + st.qi + '" data-opt="' + i + '" ' + (st.answered ? 'disabled' : '') + '>' +
        '<span class="opt-letter">' + letters[i] + '</span><span>' + esc(o) + '</span></button>').join('') +
      '</div>' +
      '<div class="ex-feedback-wrap" id="exFb"></div>' +
      '</div></div>';
    $$('.progress-fill', root).forEach(el => { requestAnimationFrame(() => el.style.width = el.style.width); });
  }
  function answerExercise(root, optIdx) {
    const st = exerciseState;
    if (!st || st.answered) return;
    const q = st.ex.questions[st.qi];
    st.answered = true;
    const correct = optIdx === q.answer;
    if (correct) st.correct += 1;
    const opts = $$('.ex-option', root);
    opts.forEach((el, i) => {
      el.classList.add('disabled');
      if (i === q.answer) el.classList.add('correct');
      if (i === optIdx && !correct) el.classList.add('wrong');
    });
    const fb = $('#exFb', root);
    fb.innerHTML = '<div class="ex-feedback ' + (correct ? 'ok' : 'no') + '">' +
      '<div class="fb-label">' + (correct ? 'Benar!' : 'Kurang tepat.') + '</div>' +
      '<div>' + esc(q.explanation) + '</div></div>' +
      '<button class="btn ' + (correct ? 'btn-primary' : 'btn-tonal') + '" style="margin-top:14px;width:100%" data-action="ex-next">' +
      (st.qi + 1 >= st.ex.questions.length ? 'Lihat Hasil' : 'Soal Berikutnya') + ' ' + icon('arrow_forward') + '</button>';
  }
  function nextExercise(root) {
    const st = exerciseState;
    st.qi += 1;
    st.answered = false;
    if (st.qi >= st.ex.questions.length) { renderExerciseResult(root); return; }
    renderExerciseQ(root);
  }
  function renderExerciseResult(root) {
    const st = exerciseState;
    const total = st.ex.questions.length;
    const pct = Math.round((st.correct / total) * 100);
    const msg = pct === 100 ? 'Sempurna!' : pct >= 70 ? 'Bagus sekali!' : pct >= 40 ? 'Terus berlatih!' : 'Ayo coba lagi!';
    if (st.ex.lessonId) lessonDone(st.ex.lessonId);
    root.innerHTML =
      '<div class="container" style="max-width:680px"><div class="card ex-result">' +
      '<div class="ex-score-ring" style="--score:' + pct + '"><div class="sr-num">' + pct + '%</div><div class="sr-label">Skor</div></div>' +
      '<div class="headline">' + msg + '</div>' +
      '<p class="body muted" style="margin:8px 0 20px">Benar ' + st.correct + ' dari ' + total + ' soal. ' + esc(st.ex.type) + ' • ' + esc(st.ex.id) + '</p>' +
      '<div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">' +
      '<button class="btn btn-primary" data-action="ex-restart">' + icon('refresh') + ' Ulangi</button>' +
      '<button class="btn btn-outline" data-nav="' + (st.ex.lessonId ? '#/lesson/' + st.ex.lessonId : '#/learn') + '">' + icon('menu_book') + ' Kembali ke Pelajaran</button>' +
      '</div></div></div>';
  }

  /* ---------------- AI ASSISTANT ---------------- */
  function aiRespond(input) {
    const q = input.toLowerCase();
    const escI = esc(input);
    const say = (text, src) => ({ text, src });
    const wordMatch = D.words.find(w => q.includes(w.word.toLowerCase()) || (w.transliteration && q.includes(w.transliteration.toLowerCase())));
    const langMatch = D.languages.find(l => q.includes(l.name.toLowerCase().replace('bahasa ', '')) || q.includes(l.englishName.toLowerCase()));
    if (q.includes('banding') || q.includes('compare')) {
      const langs = D.languages.filter(l => q.includes(l.name.toLowerCase()) || q.includes(l.englishName.toLowerCase()));
      if (langs.length >= 2) {
        const a = langs[0], b = langs[1];
        return say('Perbandingan <b>' + esc(a.name) + '</b> vs <b>' + esc(b.name) + '</b>:\n' +
          '• Rumpun: ' + familyName(a.family) + ' vs ' + familyName(b.family) + '\n' +
          '• Penutur: ' + esc(a.speakers) + ' vs ' + esc(b.speakers) + '\n' +
          '• Sistem tulisan: ' + esc(a.scripts.map(s => D.scriptById(s) ? D.scriptById(s).name : s).join(', ')) + '\n' +
          '• Kata "makan": ' + esc((D.wordsOfLanguage(a.id).find(w => w.meaning.toLowerCase().includes('makan')) || {}).word || '—') + ' vs ' + esc((D.wordsOfLanguage(b.id).find(w => w.meaning.toLowerCase().includes('makan')) || {}).word || '—') + '\n\nData demo ALFABASA — belum diverifikasi.', 'Demo Data');
      }
      return say('Sebutkan dua bahasa untuk dibandingkan, contoh: "Bandingkan Bahasa Jawa dan Bahasa Sunda".', 'ALFABASA AI');
    }
    if (wordMatch) {
      const w = wordMatch, l = D.languageById(w.languageId);
      return say('Kata <b>' + esc(w.word) + '</b> (' + esc(w.pos) + ') dalam ' + esc(l ? l.name : '') + ':\n' +
        '• Arti: ' + esc(w.meaning) + '\n' +
        '• IPA: ' + esc(w.ipa) + ' • Transliterasi: ' + esc(w.transliteration || '—') + '\n' +
        '• Contoh: "' + esc(w.examples[0] ? w.examples[0].text : '—') + '" → ' + esc(w.examples[0] ? w.examples[0].translation : '') + '\n' +
        '• Kata terkait: ' + esc(w.relatedWords.join(', ') || '—') + '\n\nData demo ALFABASA — belum diverifikasi.', 'Demo Data');
    }
    if (langMatch) {
      const l = langMatch;
      const g = D.grammarOfLanguage(l.id), c = D.cultureOfLanguage(l.id), lit = D.literatureOfLanguage(l.id);
      const scripts = l.scripts.map(s => D.scriptById(s) ? D.scriptById(s).name : s).join(', ');
      return say('Ringkasan <b>' + esc(l.name) + '</b> (' + esc(l.nativeName) + '):\n' +
        '• Rumpun: ' + familyName(l.family) + ' • Wilayah: ' + esc(l.region) + '\n' +
        '• Penutur: ' + esc(l.speakers) + ' • Status: ' + esc(l.status) + '\n' +
        '• Sistem tulisan: ' + esc(scripts) + '\n' +
        '• Tata bahasa: ' + (g.length ? esc(g.slice(0, 2).map(x => x.title).join('; ')) : '—') + '\n' +
        '• Budaya: ' + (c.length ? esc(c.slice(0, 2).map(x => x.title).join('; ')) : '—') + '\n' +
        '• Sastra: ' + (lit.length ? esc(lit.slice(0, 2).map(x => x.title).join('; ')) : '—') + '\n\nData demo ALFABASA — belum diverifikasi.', 'Demo Data');
    }
    if (q.includes('aksara') || q.includes('huruf') || q.includes('script') || q.includes('karakter')) {
      const sc = D.scripts.find(s => q.includes(s.name.toLowerCase()) || (s.languages.some(lid => q.includes((D.languageById(lid) || {}).name || ''))));
      if (sc) {
        return say('Aksara <b>' + esc(sc.name) + '</b>:\n' + '• Klasifikasi: ' + esc(sc.classification) + '\n' + '• Wilayah: ' + esc(sc.region) + '\n' + '• Arah: ' + esc(sc.direction) + '\n' + '• Unicode: ' + esc(sc.unicodeBlock) + '\n' + '• Sejarah: ' + esc(sc.history) + '\n\nData demo ALFABASA — belum diverifikasi.', 'Demo Data');
      }
    }
    if (q.includes('ipa') || q.includes('bunyi') || q.includes('pengucapan') || q.includes('fonetik')) {
      return say('Sistem IPA di ALFABASA mencakup vokal, konsonan, nada, dan tekanan dengan contoh per bahasa. Contoh konsonan khas Nusantara: /ɓ/ (implosif b, di Jawa dan Bugis) dan /ɖ/ (retrofleks d di Jawa). Buka halaman <b>Pengucapan</b> di menu Explore untuk daftar lengkap dengan audio demo.', 'ALFABASA AI');
    }
    if (q.includes('rumpun') || q.includes('keluarga') || q.includes('family')) {
      return say('ALFABASA mengklasifikasikan bahasa dari makrofamili → keluarga → cabang → subcabang → kelompok → bahasa → dialek. Contoh: Austronesia > Malayo-Polinesia > ... > Bahasa Jawa. Buka filter <b>Rumpun Bahasa</b> di daftar Bahasa untuk menjelajah.', 'ALFABASA AI');
    }
    if (q.includes('halo') || q.includes('hai') || q.includes('hello') || q.includes('hi')) {
      return say('Halo! Saya ALFABASA AI. Saya dapat menjelaskan kata, tata bahasa, aksara, membandingkan bahasa, atau merekomendasikan materi belajar. Coba: "Jelaskan kata mangan" atau "Bandingkan Bahasa Jawa dan Sunda".', 'ALFABASA AI');
    }
    if (q.includes('belajar') || q.includes('kursus') || q.includes('course') || q.includes('mulai')) {
      return say('Rekomendasi belajar:\n• <b>Bahasa Indonesia Dasar</b> — progres ' + progressOf('course-indo-dasar') + '%\n• <b>Aksara Jawa Dasar</b> — progres ' + progressOf('course-aksara-jawa') + '%\n• <b>Bahasa Jepang Dasar</b> — progres ' + progressOf('course-jepang-dasar') + '%\n\nBuka menu Learn untuk melanjutkan.', 'ALFABASA AI');
    }
    if (q.includes('terima kasih') || q.includes('thanks') || q.includes('makasih')) {
      return say('Sama-sama! Senang membantu. Jelajahi bahasa, aksara, dan budaya dunia di ALFABASA.', 'ALFABASA AI');
    }
    return say('Saya masih belajar untuk pertanyaan ini. Coba tanya tentang: kata (mis. "jelaskan kata mangan"), bahasa ("jelaskan Bahasa Jawa"), aksara ("apa itu Aksara Jawa"), perbandingan ("bandingkan Jawa dan Sunda"), atau rekomendasi belajar. Data demo ALFABASA — belum diverifikasi.', 'ALFABASA AI');
  }
  function renderAI(root, scrollToBottom) {
    root.innerHTML =
      '<div class="container ai-shell" style="max-width:860px">' +
      '<div class="page-head"><div><div class="page-sub">Asisten</div><div class="page-title">ALFABASA AI</div></div>' +
      '<button class="icon-btn" data-action="ai-clear" aria-label="Hapus percakapan">' + icon('delete_sweep') + '</button></div>' +
      '<div class="ai-messages" id="aiMsgs"></div>' +
      '<div class="ai-chips" id="aiChips">' +
      ['Jelaskan kata mangan', 'Bandingkan Jawa dan Sunda', 'Apa itu Aksara Jawa?', 'Rekomendasi belajar'].map(c =>
        '<button class="chip" data-action="ai-chip" data-prompt="' + esc(c) + '">' + esc(c) + '</button>').join('') +
      '</div>' +
      '<div class="ai-input"><textarea id="aiInput" rows="1" placeholder="Tanya ALFABASA AI... (mis. jelaskan kata banyu)" aria-label="Pesan ke AI"></textarea>' +
      '<button class="ai-send" data-action="ai-send" aria-label="Kirim">' + icon('arrow_upward') + '</button></div>' +
      '</div>';
    const msgs = $('#aiMsgs', root);
    if (State.aiMessages.length === 0) {
      State.aiMessages = [{ role: 'bot', text: 'Halo! Saya <b>ALFABASA AI</b>. Tanyakan tentang bahasa, kata, aksara, tata bahasa, budaya, atau minta rekomendasi belajar. Jawaban menggunakan data ALFABASA (demo, belum diverifikasi).' }];
      Store.set('aiMessages', State.aiMessages);
    }
    State.aiMessages.forEach(m => appendAiMsg(msgs, m));
    if (scrollToBottom) msgs.scrollTop = msgs.scrollHeight;
  }
  function appendAiMsg(msgs, m) {
    const div = document.createElement('div');
    div.className = 'ai-msg ' + (m.role === 'user' ? 'user' : 'bot');
    const meta = m.role === 'user' ? '<div class="ai-meta"><span class="ms">person</span>Anda</div>' : '<div class="ai-meta"><span class="ms">auto_awesome</span>ALFABASA AI</div>';
    div.innerHTML = meta + '<div>' + m.text.replace(/\n/g, '<br>') + '</div>' + (m.src ? '<div class="ai-src">Sumber: ' + esc(m.src) + '</div>' : '');
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function sendAi(root, text) {
    text = (text || '').trim();
    if (!text) return;
    const msgs = $('#aiMsgs', root);
    const input = $('#aiInput', root);
    if (input) input.value = '';
    State.aiMessages.push({ role: 'user', text });
    appendAiMsg(msgs, { role: 'user', text });
    // Typing indicator
    const typing = document.createElement('div');
    typing.className = 'ai-msg bot';
    typing.innerHTML = '<div class="ai-meta"><span class="ms">auto_awesome</span>ALFABASA AI</div><div class="typing-dots"><span></span><span></span><span></span></div>';
    msgs.appendChild(typing);
    msgs.scrollTop = msgs.scrollHeight;
    setTimeout(() => {
      typing.remove();
      const resp = aiRespond(text);
      State.aiMessages.push({ role: 'bot', ...resp });
      appendAiMsg(msgs, { role: 'bot', ...resp });
      Store.set('aiMessages', State.aiMessages);
    }, 700 + Math.random() * 500);
  }

  /* ---------------- GLOBAL CLICK DELEGATION ---------------- */
  document.addEventListener('click', (e) => {
    const navEl = e.target.closest('[data-nav]');
    if (navEl) { e.preventDefault(); navigate(navEl.dataset.nav); return; }

    const act = e.target.closest('[data-action]');
    if (!act) return;
    const a = act.dataset.action;
    const app = $('#app');

    switch (a) {
      case 'theme-toggle': toggleTheme(); break;
      case 'theme': applyTheme(act.dataset.theme); break;
      case 'bookmark': toggleBookmark(act.dataset.type, act.dataset.id, act.dataset.title || ''); break;
      case 'audio': {
        const btn = act;
        const key = act.dataset.text;
        playDemoAudio(key, btn);
        break;
      }
      case 'section-toggle': break; // handled inline
      case 'tab': {
        $$('.tab', app).forEach(t => t.classList.toggle('active', t === act));
        const panel = act.dataset.tab;
        $$('[data-tabpanel]', app).forEach(p => p.style.display = p.dataset.tabpanel === panel ? '' : 'none');
        break;
      }
      case 'search-go': {
        const q = ($('#searchInput', app) || {}).value || '';
        navigate('#/search?q=' + encodeURIComponent(q));
        break;
      }
      case 'search-live': break;
      case 'filter': {
        const group = act.dataset.group, val = act.dataset.value;
        const state = State.filters[group] = State.filters[group] || {};
        state.value = val;
        $$('[data-group="' + group + '"][data-action="filter"]', app).forEach(el => el.classList.toggle('active', el.dataset.value === val));
        // Re-render list via custom event
        document.dispatchEvent(new CustomEvent('alfabasa:filter', { detail: { group, value: val } }));
        break;
      }
      case 'ex-opt': answerExercise(app, parseInt(act.dataset.opt, 10)); break;
      case 'ex-next': nextExercise(app); break;
      case 'ex-restart': {
        const ex = exerciseState ? exerciseState.ex : null;
        if (ex) { initExercise(app, ex); }
        break;
      }
      case 'back-lesson': {
        const ex = exerciseState ? exerciseState.ex : null;
        const lesson = ex && ex.lessonId ? D.lessonMap[ex.lessonId] : null;
        navigate(lesson ? '#/lesson/' + lesson.id : '#/learn');
        break;
      }
      case 'ai-send': sendAi(app, $('#aiInput', app) ? $('#aiInput', app).value : ''); break;
      case 'ai-chip': sendAi(app, act.dataset.prompt); break;
      case 'ai-clear': {
        State.aiMessages = [];
        Store.set('aiMessages', []);
        renderAI(app, false);
        toast('Percakapan dihapus');
        break;
      }
      case 'retry': renderRoute(); break;
      case 'lesson-start': {
        const id = act.dataset.id;
        navigate('#/lesson/' + id);
        break;
      }
      case 'exercise-start': {
        const id = act.dataset.id;
        navigate('#/exercise/' + id);
        break;
      }
      case 'back': history.length > 1 ? history.back() : navigate('#/home'); break;
      case 'learn-more': break;
    }
  });

  /* Enter pada input AI & search */
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const t = e.target;
      if (t && t.id === 'aiInput' && !e.shiftKey) { e.preventDefault(); sendAi($('#app'), t.value); }
      if (t && t.id === 'searchInput') { e.preventDefault(); const q = t.value; navigate('#/search?q=' + encodeURIComponent(q)); }
    }
  });

  /* ---------------- THEME ---------------- */
  function applyTheme(theme) {
    State.theme = theme;
    Store.set('theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#FFFFFF');
    const icon = $('#railThemeIcon'), label = $('#railThemeLabel');
    if (icon) icon.textContent = theme === 'dark' ? 'dark_mode' : 'light_mode';
    if (label) label.textContent = theme === 'dark' ? 'AMOLED' : 'Light';
    $$('.theme-card').forEach(c => c.classList.toggle('active', c.dataset.theme === theme));
    const radios = $$('input[name="themeRadio"]');
    radios.forEach(r => { if (r.value === theme) r.checked = true; });
  }
  function toggleTheme() { applyTheme(State.theme === 'dark' ? 'light' : 'dark'); }

  /* ---------------- INIT ---------------- */
  function init() {
    applyTheme(State.theme);
    window.addEventListener('hashchange', renderRoute);
    if (!location.hash) location.hash = '#/home';
    renderRoute();
    // Skeleton progress animation support
    document.addEventListener('alfabasa:filter', () => {});
  }

  /* Expose untuk views.js */
  window.App = { State, Store, D, esc, icon, toast, navigate, isBookmarked, toggleBookmark, bookmarkBtn, statusBadge, familyName, progressOf, setProgress, lessonDone, recordHistory, playDemoAudio, audioBtn, globalSearch, initCarousel, initExpandables, initExercise, renderAI, sendAi, applyTheme, init, parseHash, registerRoute: onRoute };
  window.addEventListener('DOMContentLoaded', init);
})();

  /* ============================================================

     ============================================================ */
  const langFilters = [
    { label: 'Semua', value: 'all' },
    { label: 'Negara', value: 'country' },
    { label: 'Rumpun Bahasa', value: 'family' },
    { label: 'Status', value: 'status' },
    { label: 'Penutur', value: 'speakers' }
  ];

  function languageListHtml(query, filterVal) {
    let list = D.languages.slice();
    const q = (query || '').toLowerCase();
    if (q) list = list.filter(l => (l.name + ' ' + l.nativeName + ' ' + l.englishName + ' ' + l.region + ' ' + familyName(l.family)).toLowerCase().includes(q));
    if (filterVal && filterVal !== 'all') {
      if (filterVal === 'country') list.sort((a, b) => (a.countries[0] || '').localeCompare(b.countries[0] || ''));
      if (filterVal === 'family') list.sort((a, b) => familyName(a.family).localeCompare(familyName(b.family)));
      if (filterVal === 'status') list.sort((a, b) => a.status.localeCompare(b.status));
      if (filterVal === 'speakers') list.sort((a, b) => (parseFloat(String(b.speakers).replace(/[^0-9.]/g, '')) || 0) - (parseFloat(String(a.speakers).replace(/[^0-9.]/g, '')) || 0));
    }
    return '<div class="list">' + list.map(l =>
      '<div class="list-item" data-nav="#/language/' + l.id + '" role="button" tabindex="0">' + monogram(l.name) +
      '<div class="li-main"><div class="li-title">' + esc(l.name) + '</div>' +
      '<div class="li-sub">' + esc(l.englishName) + ' • ' + esc(familyName(l.family)) + ' • ' + esc(l.region.split('—')[0].trim()) + '</div>' +
      '<div class="row" style="margin-top:6px;gap:8px"><span class="badge primary">' + esc(l.speakers) + '</span>' + statusBadge(l.status) + '</div></div>' +
      icon('chevron_right', 'chev') + '</div>').join('') + '</div>';
  }

  function viewSearch(app, params) {
    const q = params.q || '';

    const typeIcon = { 'Bahasa': 'language', 'Dialek': 'forum', 'Rumpun Bahasa': 'account_tree', 'Aksara': 'abc', 'Karakter': 'grid_view', 'Kata': 'menu_book', 'Tata Bahasa': 'account_tree', 'Budaya': 'public', 'Sastra': 'auto_stories', 'Kursus': 'school' };
    const routeOf = (r) => {
      switch (r.type) {
        case 'Bahasa': return '#/language/' + r.id;
        case 'Aksara': return '#/script/' + r.id;
        case 'Karakter': return '#/character/' + r.id;
        case 'Kata': return '#/word/' + r.id;
        case 'Rumpun Bahasa': return '#/family/' + r.id;
        case 'Dialek': { const d = D.dialectMap[r.id]; return d ? '#/language/' + d.languageId : '#/languages'; }
        case 'Tata Bahasa': return '#/grammar/' + r.id.split('-')[0];
        case 'Budaya': return '#/culture';
        case 'Sastra': return '#/literature';
        case 'Kursus': return '#/course/' + r.id;
        default: return '#/explore';
      }
    };

    const resultHtml = results.length
      ? '<div class="list">' + results.slice(0, 30).map(r =>
        '<div class="list-item" data-nav="' + routeOf(r) + '" role="button" tabindex="0">' +
        '<span class="avatar" style="background:var(--surface-variant);color:var(--text-secondary)">' + icon(typeIcon[r.type] || 'search', '') + '</span>' +
        '<div class="li-main"><div class="li-title">' + esc(r.title) + '</div><div class="li-sub">' + esc(r.sub) + '</div></div>' +
        '<span class="badge">' + esc(r.type) + '</span>' + icon('chevron_right', 'chev') + '</div>').join('') + '</div>'
      : emptyState('search_off', 'Tidak ditemukan', 'Tidak ada hasil untuk "' + q + '". Coba kata kunci lain, misalnya "jawa", "aksara", atau "makan".', 'Cari Bahasa', '#/languages');

    app.innerHTML =
      '<div class="container" style="max-width:820px">' +
      pageHead('Pencarian', 'Seluruh database ALFABASA (demo)') +
      '<div class="searchbar"><span class="ms">search</span><input id="searchInput" type="search" value="' + esc(q) + '" placeholder="Cari bahasa, kata, aksara, karakter, atau pengetahuan..." aria-label="Pencarian global"><button class="icon-btn" data-action="search-go" aria-label="Cari" style="width:38px;height:38px">' + icon('arrow_forward') + '</button></div>' +
      (q ? '<div class="section"><div class="section-head"><div class="section-title">Hasil untuk "' + esc(q) + '"</div><span class="meta">' + results.length + ' hasil</span></div>' + resultHtml + '</div>'
        : '<div class="section"><div class="section-head"><div class="section-title">Populer</div></div>' +
        '<div class="chip-row">' + ['Jawa', 'mangan', 'Aksara', 'Mandarin', 'IPA', 'pantun'].map(t =>
          '<button class="chip" data-action="search-chip" data-q="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>' +
        '<div class="section"><div class="section-title" style="margin-bottom:10px">Jelajahi</div>' +
        '<div class="explore-grid">' +
        [['#/languages', 'language', 'Bahasa', '22 bahasa'], ['#/scripts', 'abc', 'Aksara', '16 aksara'], ['#/dictionary', 'menu_book', 'Kamus', 'Kata & arti'], ['#/pronunciation', 'graphic_eq', 'IPA', 'Bunyi bahasa']].map(x =>
          '<div class="explore-card" data-nav="' + x[0] + '" role="button"><div class="ec-icon">' + icon(x[1]) + '</div><div class="ec-title">' + esc(x[2]) + '</div><div class="ec-desc">' + esc(x[3]) + '</div></div>').join('') +
        '</div></div></div>') +
      '</div>';
    window.App.initExpandables(app);

    const inp = $('#searchInput', app);
    if (inp) inp.addEventListener('input', () => {
      const v = inp.value.trim();
      if (v.length >= 2) {
        const res = window.App.globalSearch(v);
        const list = $('.list', app);
        // Live update sederhana pada daftar hasil pertama
        if (list && res.length) {
          list.innerHTML = res.slice(0, 20).map(r =>
            '<div class="list-item" data-nav="' + routeOf(r) + '"><div class="li-main"><div class="li-title">' + esc(r.title) + '</div><div class="li-sub">' + esc(r.sub) + '</div></div><span class="badge">' + esc(r.type) + '</span></div>').join('');
        }
      }
    });
  }

  /* ============================================================
     SAVED
     ============================================================ */
  function viewSaved(app) {
    const tabs = ['Languages', 'Words', 'Scripts', 'Lessons', 'Articles'];
    const typeOf = { Languages: 'language', Words: 'word', Scripts: 'script', Lessons: 'lesson', Articles: 'literature' };
    const routeOf = { language: (b) => '#/language/' + b.id, word: (b) => '#/word/' + b.id, script: (b) => '#/script/' + b.id, lesson: (b) => '#/lesson/' + b.id, literature: (b) => '#/literature' };

    const renderTab = (tabName) => {
      const type = typeOf[tabName];
      const items = State.bookmarks.filter(b => b.type === type);
      const tabEl = $('#savedPanel', app);
      if (!tabEl) return;
      if (!items.length) {
        tabEl.innerHTML = emptyState('bookmark_border', 'Belum ada data tersimpan', 'Simpan bahasa, kata, aksara, atau pelajaran untuk akses cepat.', 'Explore Languages', '#/languages');
        return;
      }
      tabEl.innerHTML = '<div class="list">' + items.map(b => {
        const nav = routeOf[b.type] ? routeOf[b.type](b) : '#/explore';
        return '<div class="list-item" data-nav="' + nav + '">' + monogram(b.title) +
          '<div class="li-main"><div class="li-title">' + esc(b.title) + '</div>' +
          '<div class="li-sub">' + esc(tabName.slice(0, -1)) + ' • disimpan ' + new Date(b.at).toLocaleDateString('id-ID') + '</div></div>' +
          '<button class="icon-btn" style="width:36px;height:36px" data-action="bookmark" data-type="' + esc(b.type) + '" data-id="' + esc(b.id) + '" data-title="' + esc(b.title) + '" aria-label="Hapus">' + icon('delete') + '</button></div>';
      }).join('') + '</div>';
    };

    app.innerHTML =
      '<div class="container" style="max-width:820px">' +
      pageHead('Saved', 'Konten yang Anda simpan') +
      '<div class="tabs" role="tablist">' + tabs.map((t, i) =>
        '<button class="tab' + (i === 0 ? ' active' : '') + '" data-action="tab" data-tab="' + t + '" role="tab">' + esc(t) + '</button>').join('') + '</div>' +
      '<div id="savedPanel" data-tabpanel="Languages"></div>' +
      '</div>';
    window.App.initExpandables(app);
    renderTab('Languages');
    if (!window._savedListener) {
      window._savedListener = true;
      document.addEventListener('alfabasa:saved', () => {
        const a = $('#app');
        if (!a) return;
        const activeTab = a.querySelector('.tab.active');
        if (a.querySelector('#savedPanel')) renderTab(activeTab ? activeTab.dataset.tab : 'Languages');
      });
    }
  }

  /* ============================================================
     PERBANDINGAN (Menu 11)
     ============================================================ */
  function viewCompare(app, idA, idB) {
    const pickA = D.languageById(idA) || D.languageById('jawa');
    const pickB = D.languageById(idB) || D.languageById('sunda');
    const langSel = (sel, cur, otherId) =>
      '<select id="' + sel + '" class="cmp-select" aria-label="Pilih bahasa" style="flex:1;height:46px;border-radius:14px;background:var(--surface-variant);border:1px solid var(--border);padding:0 14px;font-size:14px;font-weight:600;color:var(--text-primary);outline:none">' +
      D.languages.map(l => '<option value="' + l.id + '"' + (l.id === cur.id ? ' selected' : '') + (l.id === otherId ? ' disabled' : '') + '>' + esc(l.name) + '</option>').join('') + '</select>';

    const num = (langId) => (D.comparisons.numbers.find(n => n.langId === langId) || {}).values || [];
    const phr = (langId) => (D.comparisons.phrases.find(p => p.langId === langId) || {}).values || [];
    const makanW = (langId) => (D.wordsOfLanguage(langId).find(w => w.meaning.toLowerCase().includes('makan')) || {}).word || '—';
    const scriptsA = D.scriptsOfLanguage(pickA.id), scriptsB = D.scriptsOfLanguage(pickB.id);

    const cmpRow = (label, va, vb) =>
      '<div class="list-item" style="cursor:default"><div class="li-main" style="flex:1"><div class="li-sub" style="text-transform:uppercase;letter-spacing:.8px;font-size:10.5px;font-weight:800">' + esc(label) + '</div></div>' +
      '<div style="flex:1.4;min-width:0;text-align:right;font-size:14px;font-weight:700;padding-right:10px">' + esc(va) + '</div>' +
      '<div style="flex:1.4;min-width:0;text-align:left;font-size:14px;font-weight:700;padding-left:10px">' + esc(vb) + '</div></div>';

    const conceptRows = D.comparisons.wordConcepts.map(c => {
      const ea = (c.entries.find(e => e[0] === pickA.id) || [])[1] || '—';
      const eb = (c.entries.find(e => e[0] === pickB.id) || [])[1] || '—';
      return cmpRow(c.concept, ea, eb);
    }).join('');

    const scriptCompare = (sa, sb) => {
      const ca = D.charactersOfScript(sa.id)[0], cb = D.charactersOfScript(sb.id)[0];
      return '<div class="list-item" style="cursor:default">' +
        '<div style="flex:1;text-align:center;font-size:34px;line-height:1">' + (ca ? ca.char : '—') + '</div>' +
        '<div style="flex:1;min-width:0;padding:0 10px"><div class="li-title" style="font-size:14px">' + esc(sa.name) + '</div><div class="li-sub">' + esc(sa.classification) + ' • ' + (ca ? esc(ca.unicode) : '') + '</div></div>' +
        '<div style="flex:1;min-width:0;padding:0 10px"><div class="li-title" style="font-size:14px">' + esc(sb.name) + '</div><div class="li-sub">' + esc(sb.classification) + ' • ' + (cb ? esc(cb.unicode) : '') + '</div></div>' +
        '<div style="flex:1;text-align:center;font-size:34px;line-height:1">' + (cb ? cb.char : '—') + '</div></div>';
    };

    app.innerHTML =
      '<div class="container" style="max-width:900px">' +
      pageHead('Perbandingan Bahasa', 'Menu 11: Perbandingan & Jaringan Bahasa (demo)') +
      '<div class="row" style="gap:10px;margin-bottom:8px">' + langSel('cmpA', pickA, pickB) + icon('compare_arrows') + langSel('cmpB', pickB, pickA) + '</div>' +
      '<div class="row" style="justify-content:flex-end;margin-bottom:16px"><button class="btn btn-primary" style="height:40px" data-action="cmp-go">' + icon('compare_arrows') + ' Bandingkan</button></div>' +
      '<div class="card" style="padding:0;overflow:hidden">' +
      '<div class="row" style="padding:14px 16px;background:var(--surface-variant);border-bottom:1px solid var(--border)">' +
      '<div style="flex:1"></div><div style="flex:1.4;text-align:center"><div class="title-md">' + esc(pickA.name) + '</div><div class="meta">' + esc(pickA.nativeName) + '</div></div>' +
      '<div style="flex:1.4;text-align:center"><div class="title-md">' + esc(pickB.name) + '</div><div class="meta">' + esc(pickB.nativeName) + '</div></div></div>' +
      cmpRow('Rumpun Bahasa', familyName(pickA.family), familyName(pickB.family)) +
      cmpRow('Wilayah', pickA.region.split('—')[0].trim(), pickB.region.split('—')[0].trim()) +
      cmpRow('Penutur', pickA.speakers, pickB.speakers) +
      cmpRow('Status', pickA.status, pickB.status) +
      cmpRow('Sistem Tulisan', scriptsA.map(s => s.name).join(', '), scriptsB.map(s => s.name).join(', ')) +
      cmpRow('Kata "makan"', makanW(pickA.id), makanW(pickB.id)) +
      cmpRow('Angka 1–5', (num(pickA.id).join(' · ') || '—'), (num(pickB.id).join(' · ') || '—')) +
      cmpRow('Sapaan pagi', (phr(pickA.id)[0] || '—'), (phr(pickB.id)[0] || '—')) +
      cmpRow('Terima kasih', (phr(pickA.id)[1] || '—'), (phr(pickB.id)[1] || '—')) +
      '</div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Word Comparison — satu konsep, banyak bahasa</div>' +
      '<div class="card" style="padding:0;overflow:hidden">' + conceptRows + '</div></div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Script Comparison</div>' +
      (scriptsA.length && scriptsB.length
        ? '<div class="card" style="padding:0;overflow:hidden">' + scriptCompare(scriptsA[0], scriptsB[0]) + '</div>'
        : '<div class="card"><p class="body-sm muted">Pilih bahasa dengan data aksara untuk perbandingan.</p></div>') + '</div>' +
      '<div class="section"><div class="section-head"><div class="section-title">Jaringan Bahasa</div><button class="section-link" data-nav="#/network">Buka jaringan</button></div>' +
      '<div class="related-list">' + D.languages.slice(0, 10).map(l => '<button class="chip" data-nav="#/network/' + l.id + '">' + esc(l.name) + '</button>').join('') + '</div></div>' +
      sourceNote() + '</div>';
    window.App.initExpandables(app);

    const go = app.querySelector('[data-action="cmp-go"]');
    if (go) go.addEventListener('click', () => {
      const a = app.querySelector('#cmpA').value, b = app.querySelector('#cmpB').value;
      window.App.navigate('#/compare/' + a + '/' + b);
    });
  }

  /* ============================================================

  const relTypeLabel = { ancestor: 'Ancestor (induk)', descendant: 'Descendant (turunan)', related: 'Kerabat', neighboring: 'Bertetangga', influenced_by: 'Dipengaruhi oleh', contact: 'Kontak bahasa' };

  function viewNetwork(app, id) {
    const center = D.languageById(id) || D.languageById('jawa');
    window.App.recordHistory('network', center.id, center.name);
    const rels = D.relations.filter(r => r.from === center.id || r.to === center.id);
    const nodes = [...new Set(rels.flatMap(r => [r.from, r.to]).filter(x => x !== center.id))].map(lid => D.languageById(lid)).filter(Boolean);
    const sameFamily = D.languages.filter(l => l.family === center.family && l.id !== center.id);

    app.innerHTML =
      '<div class="container" style="max-width:860px">' +
      pageHead('Jaringan Bahasa', 'Menu 11: Language Network (demo)') +
      '<div class="chip-row">' + D.languages.slice(0, 14).map(l => '<button class="chip' + (l.id === center.id ? ' active' : '') + '" data-nav="#/network/' + l.id + '">' + esc(l.name) + '</button>').join('') + '</div>' +
      '<div class="card" style="margin-top:14px;text-align:center;padding:22px">' +
      '<div class="title-lg">' + esc(center.name) + '</div>' +
      '<div class="meta">' + esc(center.englishName) + ' • ' + esc(familyName(center.family)) + '</div>' +
      '<div class="row" style="justify-content:center;margin-top:12px;gap:6px;flex-wrap:wrap">' +
      nodes.map(n => '<button class="chip" data-nav="#/network/' + n.id + '">' + esc(n.name) + '</button>').join('') +
      '</div></div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Relasi (' + rels.length + ' edge)</div>' +
      '<div class="list">' + (rels.length ? rels.map(r => {
        const other = r.from === center.id ? D.languageById(r.to) : D.languageById(r.from);
        const dir = r.from === center.id ? '→' : '←';
        return '<div class="list-item" data-nav="#/network/' + other.id + '" style="cursor:pointer">' + monogram(other.name) +
          '<div class="li-main"><div class="li-title" style="font-size:14px">' + esc(center.name) + ' ' + dir + ' ' + esc(other.name) + '</div>' +
          '<div class="li-sub">' + esc(relTypeLabel[r.type] || r.type) + '</div></div>' + icon('chevron_right', 'chev') + '</div>';
      }).join('') : '<div class="list-item" style="cursor:default"><div class="li-main"><div class="li-sub">Belum ada relasi tercatat (demo).</div></div></div>') + '</div></div>' +
      (sameFamily.length ? '<div class="section"><div class="section-title" style="margin-bottom:10px">Serumpun (' + esc(familyName(center.family)) + ')</div>' +
        '<div class="related-list">' + sameFamily.map(l => '<button class="chip" data-nav="#/language/' + l.id + '">' + esc(l.name) + '</button>').join('') + '</div></div>' : '') +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Jenis Relasi</div>' +
      '<div class="card"><div class="related-list" style="justify-content:flex-start">' +
      Object.entries(relTypeLabel).map(([k, v]) => '<span class="badge primary">' + esc(v) + '</span>').join('') +
      '</div><div class="body-sm muted" style="margin-top:10px">Node: Bahasa, Dialek, Aksara, Kata • Edge: related, uses, derived, influenced, spoken_in, written_in, borrowed.</div></div></div>' +
      sourceNote() + '</div>';
    window.App.initExpandables(app);
  }

  function viewSources(app) {
    const counts = {};
    D.sources.forEach(s => { counts[s.verification] = (counts[s.verification] || 0) + 1; });

    app.innerHTML =
      '<div class="container" style="max-width:860px">' +
      pageHead('Sumber & Verifikasi', 'Menu 12: Sumber, Verifikasi & Data (demo)') +
      '<div class="keyinfo">' +
      '<div class="ki-item"><div class="ki-label">Versi Data</div><div class="ki-value">' + esc(D.dataVersion.version) + '</div></div>' +
      '<div class="ki-item"><div class="ki-label">Status</div><div class="ki-value">' + esc(D.dataVersion.status) + '</div></div>' +
      '<div class="ki-item"><div class="ki-label">Total Rekaman</div><div class="ki-value">' + D.dataVersion.totalRecords + '+</div></div>' +
      '<div class="ki-item"><div class="ki-label">Revisi</div><div class="ki-value">' + D.revisions.length + ' log</div></div>' +
      '</div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Statistik Verifikasi</div>' +
      '<div class="stat-row">' +
      [['verified', 'Verified', counts.verified || 0], ['reviewed', 'Reviewed', counts.reviewed || 0], ['unverified', 'Unverified', counts.unverified || 0]].map(x =>
        '<div class="stat-box"><div class="sb-num">' + x[2] + '</div><div class="sb-label">' + x[1] + '</div></div>').join('') +
      '<div class="stat-box"><div class="sb-num">' + D.sources.length + '</div><div class="sb-label">Sumber</div></div>' +
      '</div></div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Daftar Sumber</div>' +
      '<div class="list">' + D.sources.map(s =>
        '<div class="list-item" style="cursor:default;align-items:flex-start">' + monogram(s.organization) +
        '<div class="li-main"><div class="li-title" style="font-size:14px">' + esc(s.title) + '</div>' +
        '<div class="li-sub">' + esc(s.organization) + ' • ' + esc(s.publication) + ' • ' + s.year + '</div>' +
        '<div class="row" style="margin-top:6px;gap:6px;flex-wrap:wrap"><span class="badge">' + esc(s.type) + '</span>' + verifBadge(s.verification) + '</div>' +
        (s.note ? '<div class="li-sub" style="margin-top:6px">' + esc(s.note) + '</div>' : '') + '</div></div>').join('') + '</div></div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Riwayat Revisi</div>' +
      '<div class="list">' + D.revisions.map(r =>
        '<div class="list-item" style="cursor:default">' + monogram(r.entity) +
        '<div class="li-main"><div class="li-title" style="font-size:14px">' + esc(r.entity) + ' → ' + esc(r.entityId) + '</div>' +
        '<div class="li-sub">' + esc(r.change) + ' • ' + esc(r.reason) + '</div></div>' +
        '<div style="text-align:right"><div class="meta">' + esc(r.by) + '</div><div class="meta">' + esc(r.at) + '</div></div></div>').join('') + '</div></div>' +
      '<div class="section"><div class="section-title" style="margin-bottom:10px">Status Konten</div>' +
      '<div class="card"><div class="related-list" style="justify-content:flex-start">' +
      ['draft', 'unverified', 'reviewed', 'verified', 'published', 'needs_update', 'archived'].map(s => '<span class="badge">' + esc(s) + '</span>').join('') +
      '</div><div class="body-sm muted" style="margin-top:10px">' + esc(D.meta.note) + '</div></div></div>' +
      '</div>';
    window.App.initExpandables(app);
  }

  /* ============================================================
     REGISTER ROUTES
     ============================================================ */
  const R = window.App.registerRoute;
  R(/^home$/, (app) => viewHome(app));
  R(/^$/, (app) => viewHome(app));
  R(/^explore$/, (app) => viewExplore(app));
  R(/^languages$/, (app, m, p) => viewLanguages(app, p));
  R(/^language\/([\w-]+)$/, (app, m) => viewLanguage(app, m[1]));
  R(/^scripts$/, (app, m, p) => viewScripts(app, p));
  R(/^script\/([\w-]+)$/, (app, m) => viewScript(app, m[1]));
  R(/^character\/([\w-]+)$/, (app, m) => viewCharacter(app, m[1]));
  R(/^dictionary$/, (app, m, p) => viewDictionary(app, p));
  R(/^word\/([\w-]+)$/, (app, m) => viewWord(app, m[1]));
  R(/^pronunciation$/, (app) => viewPronunciation(app));
  R(/^grammar$/, (app) => viewGrammar(app));
  R(/^grammar\/([\w-]+)$/, (app, m) => viewGrammar(app, m[1]));
  R(/^culture$/, (app) => viewCulture(app));
  R(/^literature$/, (app) => viewLiterature(app));
  R(/^learn$/, (app) => viewLearn(app));
  R(/^course\/([\w-]+)$/, (app, m) => viewCourse(app, m[1]));
  R(/^lesson\/([\w-]+)$/, (app, m) => viewLesson(app, m[1]));
  R(/^exercise\/([\w-]+)$/, (app, m) => {
    const ex = D.exerciseMap[m[1]];
    if (!ex) { viewError(app, 'Latihan tidak ditemukan.'); return; }
    window.App.initExercise(app, ex);
  });
  R(/^search$/, (app, m, p) => viewSearch(app, p));
  R(/^saved$/, (app) => viewSaved(app));
  R(/^profile$/, (app) => viewProfile(app));
  R(/^settings$/, (app) => viewSettings(app));
  R(/^ai$/, (app) => window.App.renderAI(app, true));
  R(/^families$/, (app) => viewFamilyList(app));
  R(/^family\/([\w-]+)$/, (app, m) => viewFamily(app, m[1]));
  R(/^menus$/, (app) => viewMenus(app));
  R(/^menu\/(\d+)$/, (app, m) => viewMenuDetail(app, m[1]));
  R(/^compare$/, (app) => viewCompare(app));
  R(/^compare\/([\w-]+)\/([\w-]+)$/, (app, m) => viewCompare(app, m[1], m[2]));
  R(/^network$/, (app) => viewNetwork(app));
  R(/^network\/([\w-]+)$/, (app, m) => viewNetwork(app, m[1]));
  R(/^sources$/, (app) => viewSources(app));

  /* Filter live re-render: daftar bahasa / aksara / kamus */
  document.addEventListener('alfabasa:filter', (e) => {
    const app = $('#app');
    const { group, value } = e.detail;
    if (group === 'langs') { const el = $('#langList', app); if (el) el.innerHTML = languageListHtml('', value); }
    if (group === 'scripts') { const el = $('#scriptList', app); if (el) el.innerHTML = scriptListHtml('', value); }
    if (group === 'dict') { const el = $('#dictList', app); if (el) el.innerHTML = dictListHtml('', value); }
  });

  /* Search chips di halaman search */
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-action="search-chip"]');
    if (chip) { e.preventDefault(); window.App.navigate('#/search?q=' + encodeURIComponent(chip.dataset.q)); }
    const edit = e.target.closest('[data-action="edit-profile"]');
    if (edit) { window.App.toast('Edit profil tersedia di versi final (demo).'); }
    const clearHist = e.target.closest('[data-action="clear-history"]');
    if (clearHist) { window.App.State.history = []; window.App.Store.set('history', []); viewProfile($('#app')); window.App.toast('Riwayat dibersihkan'); }
    const themeSys = e.target.closest('[data-action="theme-sys"]');
    if (themeSys) { window.App.toast('Sinkron tema sistem: tersedia di versi final (demo).'); }
  });

  /* Skeleton progress: animasikan setelah render */
  document.addEventListener('DOMContentLoaded', () => {
    const obs = new MutationObserver(() => {
      document.querySelectorAll('.progress-fill.animated').forEach(el => {
        if (!el.dataset.animated) { el.dataset.animated = '1'; const pct = el.style.getPropertyValue('--pct') || '0%'; el.style.width = pct; }
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  });

  window.Views = { viewHome, viewExplore, viewLanguages, viewLanguage, viewScripts, viewScript, viewCharacter, viewDictionary, viewWord, viewPronunciation, viewGrammar, viewCulture, viewLiterature, viewLearn, viewCourse, viewLesson, viewSearch, viewSaved, viewProfile, viewSettings, viewFamily, viewFamilyList, viewError, viewMenus, viewMenuDetail, viewCompare, viewNetwork, viewSources };
})();

</script>
</body>
</html>
